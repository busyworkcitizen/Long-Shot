# Cloudflare Worker for Long Shot's shared table (see README: "Multiplayer on the public site").
# Runs on Cloudflare's free plan. The Durable Object below is its database; it is created on deploy.
name = "long-shot"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Serve the Worker at https://long-shot.<your-subdomain>.workers.dev
workers_dev = true

[vars]
# Only these sites may use the table. Comma-separated, no trailing slash.
ALLOWED_ORIGINS = "https://busyworkcitizen.github.io"
# Claude model for the optional pit boss (only used if you add an ANTHROPIC_API_KEY secret).
MODEL = "claude-opus-5-5"

[[durable_objects.bindings]]
name = "TABLE"
class_name = "Table"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Table"]

# Optional pit boss: add a secret named ANTHROPIC_API_KEY in the Cloudflare dashboard
# (Worker > Settings > Variables and Secrets) or with: npx wrangler secret put ANTHROPIC_API_KEY
# Without it, answers that aren't on the house list are voided and nothing is billed.
